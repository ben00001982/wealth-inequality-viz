# Build the artefact and publish it to GitHub Pages.
#
# THIS FILE IS PARKED. Move it to .github/workflows/deploy.yml for it to run. It lives here because a
# personal access token without the workflow scope cannot write to .github/workflows, so it could not
# be pushed into place. One command, from the repository root:
#
#     git mv docs/github-pages-workflow.yml .github/workflows/deploy.yml
#
# Then enable Pages in the repository settings with Source set to GitHub Actions.
#
# What this does NOT do, deliberately: it does not run the Python pipeline. The raw Office for
# National Statistics downloads are not committed (see .gitignore, and the acquisition manifest for
# why), so the workflow cannot regenerate public/data. It builds whatever data files are committed.
#
# The consequence is worth being explicit about, because it is a foot-gun. If public/data holds
# synthetic placeholders when this runs, the deployed site shows placeholders, with its banner saying
# so. That is the correct behaviour and the banner is the safeguard, but it means "the site is live"
# and "the site is showing real data" are two different facts. Check the banner is gone before
# sending a link to a participant.
#
# Pages on a free account requires a public repository. If the repository is private, either make it
# public before the study or deploy the built site elsewhere.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. `cancel-in-progress: false` because a half-finished Pages deploy
# is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validate the data before building. A structural failure here is cheaper than discovering it
      # in a participant's browser, and the validator also fails on a mixed real-and-synthetic set,
      # which is the dangerous case.
      - name: Validate data files
        run: |
          python3 -m pip install --quiet pandas openpyxl
          python3 scripts/validate.py

      - run: npm run build

      - name: Report data provenance
        run: |
          if grep -l '"synthetic":true' public/data/*.json >/dev/null 2>&1; then
            echo "::warning title=Placeholder data::This build serves synthetic placeholder data. The site will show its placeholder banner. Do not send study links against this deployment."
          else
            echo "Data files report real pipeline provenance."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
